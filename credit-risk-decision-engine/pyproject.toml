[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-decision-engine"
version = "0.1.0"
description = "Educational end-to-end credit default prediction, decision-support and monitoring project (Home Credit Default Risk)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "lightgbm>=4.3",
  "matplotlib>=3.8", "seaborn>=0.13", "shap>=0.45", "mlflow>=2.12",
  "fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27", "joblib>=1.3", "pyyaml>=6.0", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.26", "ruff>=0.4", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E701", "E702", "E401"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
